name: Deploy Quartz site to GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci

      - name: Restore Quartz plugins
        # v5: community plugins live in .quartz/ (gitignored) and are restored from
        # quartz.lock.json — each is cloned, installed and built. `npx quartz build`
        # does NOT do this itself.
        run: npx quartz plugin restore

      - name: Point baseUrl at GitHub Pages
        # quartz.config.yaml holds the Cloudflare baseUrl (filosofia-7x5.pages.dev),
        # the primary, root-mounted host. GitHub Pages is the backup and serves from a
        # subpath (gborghi.github.io/raccolta-filosofia); building with the CF value
        # bakes an empty basePath into every page and the whole GH Pages host 404s.
        # Cloudflare is deployed manually via `wrangler pages deploy` (no CI), so only
        # this GH Pages build needs the subpath — rewrite it here, don't flip it in git.
        run: |
          sed -i 's|^  baseUrl: .*|  baseUrl: gborghi.github.io/raccolta-filosofia|' quartz.config.yaml
          grep -n '^  baseUrl:' quartz.config.yaml

      - name: Build Quartz
        # CI does NOT run preprocess.mjs: it reads VaultPhilosophy/, which is not in
        # this repo. content/ is committed already regenerated — see README.
        run: npx quartz build
        env:
          NODE_OPTIONS: "--max-old-space-size=14336"

      - name: Inject atom search + compress + shards + mobile
        # Same order as `npm run build`. make-mobile-index reads the TF-IDF master
        # written by compress-search-index; running it first fails.
        run: |
          node scripts/inject-atom-search.mjs
          NODE_OPTIONS="--max-old-space-size=8192" node scripts/compress-search-index.mjs
          node scripts/build-search-shards.mjs
          node scripts/make-mobile-index.mjs
        env:
          NODE_OPTIONS: "--max-old-space-size=8192"

      - name: Check the Cloudflare/Pages file cap
        # The SPA gate is what keeps this under the cap: one reading page per work
        # instead of one per atom. 9320 atoms as pages would blow it. If this ever
        # fails, the gate broke — do not raise the limit.
        run: |
          n=$(find public -type f | wc -l)
          echo "file emessi: $n"
          if [ "$n" -gt 18000 ]; then
            echo "::error::$n file: troppo vicino al cap di ~20k. Il gate SPA e' rotto."
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # Primary host. Separate build: GH Pages rewrites baseUrl to the subpath.
  cloudflare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Restore Quartz plugins
        run: npx quartz plugin restore
      - name: Build + search shards (Cloudflare baseUrl from git)
        run: npm run build
        env:
          NODE_OPTIONS: "--max-old-space-size=14336"
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: "88534a293fdf2c50b43a2fecdb0b59ed"
          command: pages deploy public --project-name filosofia --branch main --commit-dirty=true
